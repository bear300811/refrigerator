<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>거실 - 팀원 포트폴리오</title>
    <link rel="stylesheet" href="livingroom.css" />
  </head>
  <body>
    <a href="index.html" class="back-to-kitchen">⬅ 주방(냉장고)으로 돌아가기</a>

    <div class="livingroom-container">
      <h1 class="room-title">팀원들의 개인 방 (포트폴리오)</h1>

      <div class="doors-wrapper">
        <div
          class="room-door-container"
          data-url="https://final-liart-alpha.vercel.app/"
        >
          <div class="room-door-frame">
            <div class="room-door">
              <span class="room-knob"></span>
            </div>
          </div>
          <div class="room-label">민섭이의 방</div>
        </div>

        <div
          class="room-door-container"
          data-url="https://web-program-final-kohl.vercel.app/"
        >
          <div class="room-door-frame">
            <div class="room-door">
              <span class="room-knob"></span>
            </div>
          </div>
          <div class="room-label">건우의 방</div>
        </div>

        <div
          class="room-door-container"
          data-url="https://final-portfolio-three-rose.vercel.app/"
        >
          <div class="room-door-frame">
            <div class="room-door">
              <span class="room-knob"></span>
            </div>
          </div>
          <div class="room-label">시우의 방</div>
        </div>

        <div
          class="room-door-container"
          data-url="https://portfolio-three-gilt-84.vercel.app/"
        >
          <div class="room-door-frame">
            <div class="room-door">
              <span class="room-knob"></span>
            </div>
          </div>
          <div class="room-label">준서의 방</div>
        </div>
      </div>
    </div>

    <script src="livingroom.js"></script>
  </body>
</html>
